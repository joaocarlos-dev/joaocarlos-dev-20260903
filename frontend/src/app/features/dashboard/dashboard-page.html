<app-page-header
  eyebrow="Visão geral"
  title="Bem-vindo ao portal"
  description="Acompanhe os principais dados e acesse rapidamente as áreas administrativas."
/>

<section class="summary" aria-labelledby="summary-title">
  <div class="summary__heading">
    <div>
      <h2 id="summary-title">Resumo operacional</h2>
      <p>Totais derivados dos registros disponíveis no portal.</p>
    </div>
  </div>

  @if (loading()) {
    <app-screen-state kind="loading" title="Carregando resumo" description="Consultando usuários, unidades e colaboradores." />
  } @else if (error()) {
    <app-screen-state kind="error" title="Resumo indisponível" [description]="error()!" actionLabel="Tentar novamente" (action)="loadTotals()" />
  } @else {
  <div class="cards">
    @for (card of cardsWithTotals(); track card.path) {
      <a class="card surface" [routerLink]="card.path">
        <span>{{ card.label }}</span>
        <strong [attr.aria-label]="'Total de ' + card.label">{{ card.total }}</strong>
        <small>Acessar área <span aria-hidden="true">→</span></small>
      </a>
    }
  </div>
  }
</section>
