services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employee_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  tests:
    build:
      context: ./backend/src
      dockerfile: EmployeeManagmentSystem.API/Dockerfile
      target: test
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=employee_management_tests;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend/src
      dockerfile: EmployeeManagmentSystem.API/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=employee_management;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
