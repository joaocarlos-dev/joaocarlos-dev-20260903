services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employee_management
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tests:
    build:
      context: ./backend/src
      dockerfile: EmployeeManagmentSystem.API/Dockerfile
      target: test
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=employee_management_tests;Username=${POSTGRES_USER:?POSTGRES_USER must be set};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RabbitMq__Exchange: ${RABBITMQ_EXCHANGE:-employee-management.events.v2}
      RabbitMq__Queue: ${RABBITMQ_QUEUE:-employee-management.user-registrations.v2}
      RabbitMq__UnroutedExchange: ${RABBITMQ_UNROUTED_EXCHANGE:-employee-management.unrouted.v2}
      RabbitMq__UnroutedQueue: ${RABBITMQ_UNROUTED_QUEUE:-employee-management.unrouted.v2}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend/src
      dockerfile: EmployeeManagmentSystem.API/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=employee_management;Username=${POSTGRES_USER:?POSTGRES_USER must be set};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER must be set}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE must be set}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RabbitMq__Exchange: ${RABBITMQ_EXCHANGE:-employee-management.events.v2}
      RabbitMq__Queue: ${RABBITMQ_QUEUE:-employee-management.user-registrations.v2}
      RabbitMq__UnroutedExchange: ${RABBITMQ_UNROUTED_EXCHANGE:-employee-management.unrouted.v2}
      RabbitMq__UnroutedQueue: ${RABBITMQ_UNROUTED_QUEUE:-employee-management.unrouted.v2}
      InitialUser__Code: ${INITIAL_USER_CODE:?INITIAL_USER_CODE must be set}
      InitialUser__Login: ${INITIAL_USER_LOGIN:?INITIAL_USER_LOGIN must be set}
      InitialUser__Password: ${INITIAL_USER_PASSWORD:?INITIAL_USER_PASSWORD must be set}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq-stress-tests:
    build:
      context: ./backend/src
      dockerfile: EmployeeManagmentSystem.API/Dockerfile
      target: test
    profiles:
      - stress
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=employee_management_stress_tests;Username=${POSTGRES_USER:?POSTGRES_USER must be set};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RabbitMq__Exchange: ${RABBITMQ_EXCHANGE:-employee-management.events.v2}
      RabbitMq__Queue: ${RABBITMQ_QUEUE:-employee-management.user-registrations.v2}
      RabbitMq__UnroutedExchange: ${RABBITMQ_UNROUTED_EXCHANGE:-employee-management.unrouted.v2}
      RabbitMq__UnroutedQueue: ${RABBITMQ_UNROUTED_QUEUE:-employee-management.unrouted.v2}
      RabbitMq__RunStressTests: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
    environment:
      API_BASE_URL: http://api:8080
      SMOKE_LOGIN: ${INITIAL_USER_LOGIN:?INITIAL_USER_LOGIN must be set}
      SMOKE_PASSWORD: ${INITIAL_USER_PASSWORD:?INITIAL_USER_PASSWORD must be set}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: final
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
      frontend-tests:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
